name: Content health check
on:
  pull_request:
    paths:
      - content/**
      - scripts/**
      - src/**
      - site.config.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check
