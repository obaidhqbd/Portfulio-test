name: Content health check

on:
  pull_request:
    paths:
      - 'content/**'
      - 'site.config.json'
      - 'scripts/**'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm run check
